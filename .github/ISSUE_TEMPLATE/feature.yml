name: Feature request
description: Suggest an improvement. Detection ideas should explain how they stay precise.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: precision
    attributes:
      label: False-positive risk
      description: For detection changes, how could this misfire on legitimate sites? (see docs/SIGNALS.md)
