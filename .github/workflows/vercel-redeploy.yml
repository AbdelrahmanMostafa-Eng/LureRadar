name: Vercel redeploy

# Called after feed-refresh.yml and pc-watch.yml publish new data, so the
# Vercel copy of the site rebuilds with it (web/scripts/vercel-build.sh pulls
# the rolling release assets at build time). Does nothing unless the
# repository secret VERCEL_DEPLOY_HOOK_URL holds a Vercel deploy hook
# (Vercel project -> Settings -> Git -> Deploy Hooks, branch `main`).
on:
  workflow_call:
    secrets:
      VERCEL_DEPLOY_HOOK_URL:
        required: false

permissions: {}

jobs:
  redeploy:
    name: Trigger the Vercel deploy hook
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST the deploy hook (skipped when the secret is unset)
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${VERCEL_DEPLOY_HOOK_URL}" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not set: nothing to do."
            exit 0
          fi
          curl -fsS -X POST --max-time 30 -o /dev/null "${VERCEL_DEPLOY_HOOK_URL}"
          echo "Vercel redeploy requested."
