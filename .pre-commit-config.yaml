# Install: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: secrets
        name: secret scan
        entry: uv run python scripts/check_secrets.py
        language: system
        pass_filenames: false
      - id: fixtures
        name: fixture domain guard
        entry: uv run python scripts/check_fixture_domains.py
        language: system
        pass_filenames: false
        files: ^tests/fixtures/
      - id: packs
        name: validate packs
        entry: uv run lureradar pack validate
        language: system
        pass_filenames: false
        files: ^packs/
